<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Take — Tour Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --ink:#0A0A0A; --ink-2:#1A1A1A; --ink-60:#6B6B6B; --ink-40:#9A9A9A;
    --paper:#fff; --sand:#F5F2EC; --sand-2:#EAE5DC;
    --line:#ECECEC; --line-sand:#E3DED4; --accent:#007AFF; --oxblood:#9B2C2C;
    --serif:'Fraunces', Georgia, serif;
    --sans:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased;}
  body{font-family:var(--sans); color:var(--ink); background:#E5DFD3; padding:56px 40px 72px; display:flex; flex-direction:column; align-items:center;}
  .page-title{font-family:var(--serif); font-size:30px; font-weight:400; letter-spacing:-.01em; margin-bottom:4px; color:#2a271f;}
  .page-sub{font-family:var(--serif); font-style:italic; font-size:15px; color:#8f8a7e; margin-bottom:36px; text-align:center;}
  .frame-wrap{display:flex; flex-direction:column; align-items:center; gap:16px;}
  .caption{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#8f8a7e;}

  .phone{width:390px; height:844px; background:var(--paper); border-radius:46px; box-shadow:0 2px 2px rgba(0,0,0,.04), 0 30px 60px -20px rgba(40,35,25,.45); position:relative; overflow:hidden; border:1px solid rgba(0,0,0,.06); display:flex; flex-direction:column;}
  .notch{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:120px; height:30px; background:var(--ink); border-radius:18px; z-index:1200;}
  .statusbar{height:54px; flex:0 0 54px; display:flex; align-items:center; justify-content:space-between; padding:0 30px 0 34px; font-size:15px; font-weight:600; z-index:1100;}
  .statusbar .icons{display:flex; gap:6px; font-size:13px;}

  .m-top{display:flex; align-items:center; justify-content:space-between; padding:0 18px;}
  .m-top a.back{color:var(--accent); font-size:16px; text-decoration:none;}
  .seg{display:flex; background:var(--sand-2); border-radius:9px; padding:2px;}
  .seg a{font-size:13px; font-weight:600; color:var(--ink-60); padding:5px 14px; border-radius:7px; text-decoration:none;}
  .seg a.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .m-context{padding:10px 24px 10px; font-size:13px; color:var(--ink-60);}
  .m-context b{color:var(--ink); font-weight:600;}

  #map{flex:0 0 430px; height:430px; width:100%; background:#e8e6df; z-index:1;}
  .leaflet-container{font-family:var(--sans);}
  /* pins */
  .mpin{width:30px; height:30px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; border:2.5px solid #fff; box-shadow:0 2px 7px rgba(0,0,0,.4);}
  .mpin.active{background:var(--accent); transform:scale(1.12);}
  .mplace{display:flex; flex-direction:column; align-items:center;}
  .mplace .ic{width:32px; height:32px; border-radius:50%; background:#fff; border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .mplace .ic svg{width:16px; height:16px; color:var(--accent);}
  .mplace .lb{margin-top:3px; font-size:8.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); background:#fff; border:1px solid rgba(0,122,255,.25); border-radius:100px; padding:1px 6px; white-space:nowrap;}
  .legend{position:absolute; top:108px; left:14px; background:rgba(255,255,255,.93); border:1px solid var(--line-sand); border-radius:11px; padding:7px 10px; font-size:11px; display:flex; flex-direction:column; gap:5px; z-index:1000;}
  .legend .lrow{display:flex; align-items:center; gap:7px; color:var(--ink-60); font-weight:500;}
  .legend .dotk{width:12px; height:12px; border-radius:50%;}
  .legend .dotk.stop{background:var(--ink);}
  .legend .dotk.place{background:#fff; border:1.5px solid var(--accent);}

  .sheet{flex:1; background:var(--paper); border-top:1px solid var(--line); border-radius:20px 20px 0 0; margin-top:-18px; box-shadow:0 -6px 20px -8px rgba(40,35,25,.18); position:relative; z-index:1000; padding:0 0 16px; overflow-y:auto;}
  .grab{width:38px; height:5px; border-radius:3px; background:var(--sand-2); margin:9px auto 6px;}
  .sheet-row{display:flex; align-items:center; gap:12px; padding:6px 18px 4px;}
  .sp-thumb{width:46px; height:46px; border-radius:11px; overflow:hidden; position:relative; flex:0 0 46px; background:linear-gradient(165deg,#b9a98c,#5c5346);}
  .sp-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .sp-info{flex:1; min-width:0;}
  .sp-addr{font-size:15.5px; font-weight:600; letter-spacing:-.01em;}
  .sp-meta{font-size:12.5px; color:var(--ink-60); margin-top:2px;}
  .sp-meta .price{color:var(--ink); font-weight:600;}
  .dir{display:flex; align-items:center; gap:5px; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; flex:0 0 auto;}
  .dir svg{width:15px; height:15px;}
  .prox-lab{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-40); font-weight:700; padding:14px 20px 0;}
  .prox{padding:6px 20px 0;}
  .prow{display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--line);}
  .prow:last-child{border-bottom:none;}
  .picon{width:26px; height:26px; border-radius:7px; background:var(--sand); display:flex; align-items:center; justify-content:center; flex:0 0 26px;}
  .picon svg{width:14px; height:14px; color:var(--accent);}
  .pname{flex:1; font-size:14px; font-weight:500;}
  .ptime{font-size:14px; font-weight:600;}
  .ptime span{font-size:12px; color:var(--ink-60); font-weight:400;}
  .hint{font-size:11.5px; color:var(--ink-40); text-align:center; padding:12px 20px 0;}
</style>
</head>
<body>
  <div class="page-title">Take</div>
  <div class="page-sub">The tour on a real map — tap any pin. Alpharetta &amp; Milton, GA.</div>

  <div class="frame-wrap">
    <div class="phone">
      <div class="notch"></div>
      <div class="statusbar"><span>9:41</span><span class="icons">􀙇 􀊰 􀛨</span></div>
      <div class="m-top">
        <a class="back" href="buyer.html">‹ Tour</a>
        <div class="seg"><a href="buyer.html">List</a><a class="on" href="map.html">Map</a></div>
        <span style="width:42px"></span>
      </div>
      <div class="m-context"><b>Tuesday, June 9</b> · 5 stops · Marcus &amp; Lena</div>
      <div id="map"></div>
      <div class="legend">
        <div class="lrow"><span class="dotk stop"></span>Tour stops</div>
        <div class="lrow"><span class="dotk place"></span>Their places</div>
      </div>
      <div class="sheet">
        <div class="grab"></div>
        <div class="sheet-row">
          <div class="sp-thumb"><img id="spImg" src=""></div>
          <div class="sp-info"><div class="sp-addr" id="spAddr"></div><div class="sp-meta" id="spMeta"></div></div>
          <div class="dir" id="spDir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>Directions</div>
        </div>
        <div class="prox-lab">How it fits their life</div>
        <div class="prox" id="prox"></div>
        <div class="hint">Tap a pin to compare. Drive times are estimates.</div>
      </div>
    </div>
    <div class="caption">Tour map — real streets, real homes</div>
  </div>

<script>
  const ICON_WORK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  const ICON_SCHOOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11v5c0 1 2.2 2.5 5 2.5s5-1.5 5-2.5v-5"/></svg>';

  const HOMES = [
    {n:1, addr:"98 Academy Street", city:"Alpharetta GA", lat:34.0756890, lng:-84.2909150, price:"$785K", bd:3, ba:2, time:"10:00 AM", img:"https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=200&q=70"},
    {n:2, addr:"178 Sedalia Court", city:"Alpharetta GA", lat:34.0797217, lng:-84.2733182, price:"$925K", bd:4, ba:3, time:"10:45 AM", img:"https://images.unsplash.com/photo-1599809275671-b5942cabc7a2?w=200&q=70"},
    {n:3, addr:"4110 Providence Square", city:"Alpharetta GA", lat:34.0974032, lng:-84.3041811, price:"$1.15M", bd:5, ba:4, time:"11:30 AM", img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=200&q=70", active:true},
    {n:4, addr:"205 Mayfield Circle", city:"Alpharetta GA", lat:34.0827332, lng:-84.3035712, price:"$865K", bd:4, ba:3, time:"1:00 PM", img:"https://images.unsplash.com/photo-1605276374104-dee2a0ed3cd6?w=200&q=70"},
    {n:5, addr:"2355 Hopewell Plantation", city:"Milton GA", lat:34.1070865, lng:-84.2870474, price:"$1.65M", bd:5, ba:5, time:"1:45 PM", img:"https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=200&q=70"}
  ];
  const PLACES = [
    {key:"work", label:"Work", name:"Lena’s office · Northfall Ln", lat:34.0755962, lng:-84.2945964, icon:ICON_WORK},
    {key:"school", label:"School", name:"King’s Ridge School", lat:34.1162419, lng:-84.2801356, icon:ICON_SCHOOL}
  ];

  function miles(a,b){const R=3958.8,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,
    la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
    const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));}
  function driveMin(a,b){return Math.max(3, Math.round(miles(a,b)/32*60*1.35));}

  const map = L.map('map', {zoomControl:true, attributionControl:true}).setView([34.092,-84.292], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);

  // route line in tour order
  L.polyline(HOMES.map(h=>[h.lat,h.lng]), {color:'#0A0A0A', weight:2.5, opacity:.8, dashArray:'1 7'}).addTo(map);

  // place markers
  PLACES.forEach(p=>{
    L.marker([p.lat,p.lng], {icon:L.divIcon({className:'', html:'<div class="mplace"><div class="ic">'+p.icon+'</div><span class="lb">'+p.label+'</span></div>', iconSize:[34,46], iconAnchor:[17,17]})}).addTo(map);
  });

  // home markers
  const markers = {};
  HOMES.forEach(h=>{
    const m = L.marker([h.lat,h.lng], {icon:L.divIcon({className:'', html:'<div class="mpin'+(h.active?' active':'')+'" data-n="'+h.n+'">'+h.n+'</div>', iconSize:[30,30], iconAnchor:[15,15]})}).addTo(map);
    m.on('click', ()=>select(h.n));
    markers[h.n]=m;
  });

  function setPinActive(n){
    HOMES.forEach(h=>{
      const el = markers[h.n].getElement(); if(!el) return;
      const pin = el.querySelector('.mpin'); if(pin) pin.classList.toggle('active', h.n===n);
    });
  }
  function select(n){
    const h = HOMES.find(x=>x.n===n);
    document.getElementById('spImg').src = h.img;
    document.getElementById('spAddr').textContent = h.addr;
    document.getElementById('spMeta').innerHTML = '<span class="price">'+h.price+'</span> · '+h.bd+' bd · '+h.ba+' ba · '+h.time;
    document.getElementById('spDir').onclick = ()=>{ window.open('https://maps.apple.com/?daddr='+encodeURIComponent(h.addr+', '+h.city), '_blank'); };
    const prox = PLACES.map(p=>(
      '<div class="prow"><span class="picon">'+p.icon+'</span><span class="pname">'+p.name+'</span>'+
      '<span class="ptime">'+driveMin(h,p)+' min <span>drive</span></span></div>'
    )).join('');
    document.getElementById('prox').innerHTML = prox;
    setPinActive(n);
  }

  map.fitBounds(L.latLngBounds([...HOMES,...PLACES].map(x=>[x.lat,x.lng])), {padding:[42,42]});
  select(3);
</script>
</body>
</html>
